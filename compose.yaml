name: lakehouse-mcp

# Polaris server and admin tool must read the same metastore. testkit/LakehouseStack uses this same config.
x-polaris-persistence: &polaris-persistence
  polaris.persistence.type: relational-jdbc
  quarkus.datasource.username: polaris
  quarkus.datasource.password: ${POSTGRES_PASSWORD:-change-me-postgres}
  quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/polaris

# No bind mounts outside the tools service: `make up` also runs inside that container and paths would not resolve.
services:
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: -Xmx768m
    ports: ["19092:19092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null"]
      interval: 10s
      timeout: 15s
      retries: 12

  # Creates the events topic before the connector exists: otherwise the sink's subscription auto-creates it with 1
  # partition and the producer (KafkaEventSink.PARTITIONS = 6) finds it already there (T-114). Idempotent.
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists",
                 "--topic", "ecommerce.events", "--partitions", "6", "--replication-factor", "1"]
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.0
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_HEAP_OPTS: -Xmx256m
    ports: ["8081:8081"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]  # no curl in Confluent images
      interval: 10s
      timeout: 5s
      retries: 18

  seaweedfs:
    build: infra/seaweedfs
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["8333:8333"]
    volumes: [seaweedfs-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 18

  postgres:
    build: infra/postgres
    environment:
      POSTGRES_DB: polaris
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      # Over TCP: during initdb the temporary server only listens on the unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U polaris -d polaris"]
      interval: 5s
      timeout: 5s
      retries: 24

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.8.0
    depends_on:
      postgres: {condition: service_healthy}
    environment: *polaris-persistence
    command: ["bootstrap", "-r", "${POLARIS_REALM}", "-c", "${POLARIS_REALM},${POLARIS_CLIENT_ID},${POLARIS_CLIENT_SECRET}"]
    restart: "no"

  polaris:
    image: apache/polaris:1.8.0
    depends_on:
      seaweedfs: {condition: service_healthy}
      postgres: {condition: service_healthy}
      polaris-bootstrap: {condition: service_completed_successfully}
    environment:
      <<: *polaris-persistence
      polaris.realm-context.realms: ${POLARIS_REALM}
      AWS_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      JAVA_OPTS_APPEND: -Xmx512m
    ports: ["8181:8181", "8182:8182"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8182/q/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18

  lakehouse-init:
    build: infra/polaris
    depends_on:
      polaris: {condition: service_healthy}
    env_file: [.env]
    restart: "no"

  connect:
    build: infra/connect
    depends_on:
      kafka: {condition: service_healthy}
      schema-registry: {condition: service_healthy}
      lakehouse-init: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: lakehouse-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _connect-configs
      CONNECT_OFFSET_STORAGE_TOPIC: _connect-offsets
      CONNECT_STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # An idle sink only wakes up at each flush, and only then the Iceberg task reads its control topic. At the default
      # 60 s it misses every commit window (30 s) and nothing is written. The sink keeps its offsets elsewhere: flushing is cheap.
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 1000
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components,/opt/connectors
      KAFKA_HEAP_OPTS: -Xmx1g
      AWS_REGION: ${S3_REGION}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083"]  # no curl in Confluent images
      interval: 10s
      timeout: 5s
      retries: 30

  connect-init:
    build: connect
    depends_on:
      connect: {condition: service_healthy}
    env_file: [.env]
    restart: "no"

  mcp-server:
    build:
      context: .
      dockerfile: infra/mcp-server/Dockerfile
    depends_on:
      polaris: {condition: service_healthy}
      postgres: {condition: service_healthy}
      lakehouse-init: {condition: service_completed_successfully}
    environment:
      MCP_SERVER_ADDRESS: 0.0.0.0
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      MCP_ANALYST_KEY: ${MCP_ANALYST_KEY}
      MCP_ADMIN_KEY: ${MCP_ADMIN_KEY}
      OPS_DB_URL: jdbc:postgresql://postgres:5432/ops
      OPS_DB_USER: polaris
      OPS_DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    # Host loopback only, and every call needs a Bearer key (analyst or admin). Other services reach it at mcp-server:8090.
    ports: ["127.0.0.1:8090:8090"]

  # One run on demand (`make expire`), never started by `make up`. Takes its arguments from the command line.
  expire-snapshots:
    build:
      context: .
      dockerfile: infra/maintenance/Dockerfile
    profiles: [maintenance]
    depends_on:
      polaris: {condition: service_healthy}
      lakehouse-init: {condition: service_completed_successfully}
    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      POLARIS_REALM: ${POLARIS_REALM}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
    restart: "no"

  # One question on demand (`make ask Q=...`), never started by `make up`. Answers and exits.
  agent:
    build:
      context: .
      dockerfile: infra/agent/Dockerfile
    profiles: [agent]
    depends_on:
      mcp-server: {condition: service_healthy}
    environment:
      MCP_SERVER_URL: http://mcp-server:8090
      MCP_ANALYST_KEY: ${MCP_ANALYST_KEY:-}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-google-genai}
      AGENT_MODEL: ${AGENT_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    mem_limit: 1g
    restart: "no"

  # JDK, Maven, make, Docker CLI, DuckDB CLI and Kaggle CLI: nothing is installed on the host.
  tools:
    build: infra/tools
    profiles: [tools]
    working_dir: /workspace
    environment:
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]
    env_file: [.env]
    volumes:
      - .:/workspace
      - m2:/root/.m2
      - data:/data
      - ~/.kaggle:/root/.kaggle:ro
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  kafka-data:
  seaweedfs-data:
  postgres-data:
  m2:
  data:

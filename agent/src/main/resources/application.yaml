spring:
  application:
    name: agent
  main:
    web-application-type: none
    banner-mode: "off"
  ai:
    model:
      # google-genai or anthropic: both are in the jar, only this one starts.
      chat: ${AGENT_PROVIDER:google-genai}
      # Only chat is used, and these would ask for a key of their own.
      embedding:
        text: none
        multimodal: none
      image: none
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          # Not checked against the current free tier yet: see docs/wiki/componentes/agente.md.
          model: ${AGENT_MODEL:gemini-2.5-flash}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        # Without a default on purpose: the Gemini one means nothing here.
        model: ${AGENT_MODEL}
    tools:
      limits:
        # Counts every call to a tool in one question, however many arrive at once.
        max-total-tool-calls: ${AGENT_MAX_TOOL_CALLS:10}
    mcp:
      client:
        name: lakehouse-agent
        version: 0.1.0
        request-timeout: ${AGENT_MCP_TIMEOUT:60s}
        streamable-http:
          connections:
            lakehouse:
              url: ${MCP_SERVER_URL:http://localhost:8090}

agent:
  mcp:
    analyst-key: ${MCP_ANALYST_KEY:}
  limits:
    # 0 is no limit. Tokens (input + output) and USD per question, USD per run; the USD ones need the prices of the model.
    max-tokens: ${AGENT_MAX_TOKENS:200000}
    max-usd-per-question: ${AGENT_MAX_USD_PER_QUESTION:0}
    max-usd-per-run: ${AGENT_MAX_USD_PER_RUN:0}
    usd-per-million-input: ${AGENT_USD_PER_MILLION_INPUT:0}
    usd-per-million-output: ${AGENT_USD_PER_MILLION_OUTPUT:0}

logging:
  level:
    root: WARN
    # A tool that answers with an error is part of the conversation: the model reads it and tries again.
    org.springframework.ai.mcp.SyncMcpToolCallback: "OFF"
    # Warns that this client offers no sampling or elicitation, which is the idea, on the stdout of every run.
    org.springframework.ai.mcp.annotation: ERROR
    <rect x="620" y="220" width="270" height="100" rx="12" fill="#24283B" stroke="#E0AF68" stroke-width="2"/><text x="640" y="254">Seguridad</text><text x="640" y="280" font-size="13" font-weight="400" fill="#9AA5CE">Roles y claves; falta auditoría</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="360" rx="18" fill="#16161E"/>

    <rect x="40" y="220" width="270" height="100" rx="12" fill="#24283B" stroke="#E0AF68" stroke-width="2"/><text x="60" y="254">Agente</text><text x="60" y="280" font-size="13" font-weight="400" fill="#9AA5CE">Contesta por MCP; falta el GIF real</text>
